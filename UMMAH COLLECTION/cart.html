<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - UMMAH COLLECTION</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-star-and-crescent"></i>
                UMMAH COLLECTION
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="cart-page">
        <h2>Shopping Cart</h2>
        <div class="cart-container">
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be displayed here -->
            </div>
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-item">
                    <span>Subtotal</span>
                    <span id="subtotal">৳0</span>
                </div>
                <div class="summary-item">
                    <span>Delivery Fee</span>
                    <span id="delivery-fee">৳60</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">৳0</span>
                </div>
                <button class="btn-primary checkout-btn" onclick="window.location.href='checkout.html'">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2024 UMMAH COLLECTION. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/cart.js"></script>
</body>
</html>
